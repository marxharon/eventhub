server:
  port: 8082

spring:
  application:
    name: event-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:postgres}:5432/${POSTGRES_DB:eventhub_db}
    username: ${POSTGRES_USER:eventhub}
    password: ${POSTGRES_PASSWORD:eventhub_secret_2026}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

eventhub:
  jwt:
    secret: ${JWT_SECRET:EventHubSuperSecretKeyForJwtAuthentication2026MicroservicesArchitecture}
  downstream:
    registration-service-url: ${REGISTRATION_SERVICE_URL:http://registration-service:8084}
    notification-service-url: ${NOTIFICATION_SERVICE_URL:http://notification-service:8086}
    notification-timeout-ms: 1500

springdoc:
  api-docs:
    path: /api/events/openapi.json
  swagger-ui:
    path: /api/events/docs
    url: /api/events/openapi.json

