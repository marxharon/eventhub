services:
  postgres:
    image: postgres:16-alpine
    container_name: eventhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eventhub_db}
      POSTGRES_USER: ${POSTGRES_USER:-eventhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eventhub_secret_2026}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eventhub} -d ${POSTGRES_DB:-eventhub_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - eventhub-net

  api-gateway:
    image: nginx:1.27-alpine
    container_name: eventhub-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./infra/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./web-app:/usr/share/nginx/html:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - eventhub-net

  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: eventhub-user-service
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-eventhub_db}
      POSTGRES_USER: ${POSTGRES_USER:-eventhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eventhub_secret_2026}
      JWT_SECRET: ${JWT_SECRET:-EventHubSuperSecretKeyForJwtAuthentication2026MicroservicesArchitecture}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/api/users/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - eventhub-net

  event-service:
    build:
      context: ./services/event-service
      dockerfile: Dockerfile
    container_name: eventhub-event-service
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-eventhub_db}
      POSTGRES_USER: ${POSTGRES_USER:-eventhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eventhub_secret_2026}
      JWT_SECRET: ${JWT_SECRET:-EventHubSuperSecretKeyForJwtAuthentication2026MicroservicesArchitecture}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8082/api/events/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - eventhub-net

  search-service:
    build:
      context: ./services/search-service
      dockerfile: Dockerfile
    container_name: eventhub-search-service
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-eventhub_db}
      POSTGRES_USER: ${POSTGRES_USER:-eventhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eventhub_secret_2026}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8083/api/search/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - eventhub-net

volumes:
  postgres_data:

networks:
  eventhub-net:
    driver: bridge
    name: eventhub-net
