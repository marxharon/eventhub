worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logs estruturados com rastreamento de correlação e latência (RQ06)
    log_format eventhub_log '$remote_addr - [$time_local] "$request" '
                            'status=$status bytes=$body_bytes_sent '
                            'rt=$request_time uct="$upstream_connect_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log eventhub_log;
    error_log  /var/log/nginx/error.log warn;

    sendfile        off;
    keepalive_timeout  65;

    # Resolvedor DNS interno do Docker para subida resiliente sem depender de todos os containers ativos (RQ03/RQ08)
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # Cabeçalhos comuns de proxy e rastreabilidade (RQ06 / RN07)
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Correlation-ID $request_id;
        add_header X-Correlation-ID $request_id always;

        # Timeouts ajustados para resposta ágil
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;

        # Endpoint de Healthcheck do próprio API Gateway
        location = /health {
            default_type application/json;
            return 200 '{"status":"UP","component":"api-gateway","port":8080,"architecture":"EventHub Microservices"}';
        }

        # 1. Serviço de Usuários/Perfis (Java / Spring Boot :8081) - RF01, RN07
        location /api/users {
            set $user_upstream http://user-service:8081;
            proxy_pass $user_upstream;
            proxy_intercept_errors on;
            error_page 502 503 504 = @service_unavailable_users;
        }

        location @service_unavailable_users {
            default_type application/json;
            return 503 '{"status":"DOWN","service":"user-service","stack":"Java 21 / Spring Boot","message":"Serviço de Usuários ainda não iniciado ou indisponível."}';
        }

        # 2. Serviço de Eventos e Programações (Java / Spring Boot :8082) - RF02, RF03, RF09, RF10, RN06
        location /api/events {
            set $event_upstream http://event-service:8082;
            proxy_pass $event_upstream;
            proxy_intercept_errors on;
            error_page 502 503 504 = @service_unavailable_events;
        }

        location @service_unavailable_events {
            default_type application/json;
            return 503 '{"status":"DOWN","service":"event-service","stack":"Java 21 / Spring Boot","message":"Serviço de Eventos ainda não iniciado ou indisponível."}';
        }

        # 3. Serviço de Busca (Python / FastAPI :8083) - RF04, RQ02
        location /api/search {
            set $search_upstream http://search-service:8083;
            proxy_pass $search_upstream;
            proxy_intercept_errors on;
            error_page 502 503 504 = @service_unavailable_search;
        }

        location @service_unavailable_search {
            default_type application/json;
            return 503 '{"status":"DOWN","service":"search-service","stack":"Python 3.12 / FastAPI","message":"Serviço de Busca ainda não iniciado ou indisponível."}';
        }

        # Webhook interno do payment-service: bloqueado na borda (acesso apenas pela rede Docker)
        location = /api/registrations/payment-webhook {
            default_type application/json;
            return 404 '{"status":"NOT_FOUND","message":"Endpoint interno."}';
        }

        # 4. Serviço de Inscrição (Java / Spring Boot :8084) - RF05, RF06, RF09, RF11, RN01-RN05
        location /api/registrations {
            set $registration_upstream http://registration-service:8084;
            proxy_pass $registration_upstream;
            proxy_intercept_errors on;
            error_page 502 503 504 = @service_unavailable_registrations;
        }

        location @service_unavailable_registrations {
            default_type application/json;
            return 503 '{"status":"DOWN","service":"registration-service","stack":"Java 21 / Spring Boot","message":"Serviço de Inscrição ainda não iniciado ou indisponível."}';
        }

        # 5. Serviço de Pagamento (Python / FastAPI :8085) - RF07, RN02, RN03
        location /api/payments {
            set $payment_upstream http://payment-service:8085;
            proxy_pass $payment_upstream;
            proxy_intercept_errors on;
            error_page 502 503 504 = @service_unavailable_payments;
        }

        location @service_unavailable_payments {
            default_type application/json;
            return 503 '{"status":"DOWN","service":"payment-service","stack":"Python 3.12 / FastAPI","message":"Serviço de Pagamento ainda não iniciado ou indisponível."}';
        }

        # 6. Serviço de Notificação (Python / FastAPI :8086) - RF08, RN05
        location /api/notifications {
            set $notification_upstream http://notification-service:8086;
            proxy_pass $notification_upstream;
            proxy_intercept_errors on;
            error_page 502 503 504 = @service_unavailable_notifications;
        }

        location @service_unavailable_notifications {
            default_type application/json;
            return 503 '{"status":"DOWN","service":"notification-service","stack":"Python 3.12 / FastAPI","message":"Serviço de Notificação ainda não iniciado ou indisponível."}';
        }

        # Entrega da Aplicação Web SPA Moderna (Vue 3 + Tailwind + DaisyUI)
        location / {
            etag off;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            try_files $uri $uri/ /index.html;
        }
    }
}
